<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JS Movies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. TOP BAR: type tabs, page links, settings button -->
  <header id="top" class="bar">
    <nav class="tabs" id="typeTabs" aria-label="Browse by type">
      <button data-type="movie">Movies</button>
      <button data-type="anime">Anime</button>
      <button data-type="tv">Tv shows</button>
      <button data-type="popular">Popular</button>
    </nav>

    <nav class="links" aria-label="Site">
      <a href="#" id="homeLink">Home</a>
      <a href="#" id="aboutLink">About</a>
      <a href="#" id="contactLink">Contact</a>
      <button id="menuBtn" aria-label="Open settings" aria-expanded="false" aria-controls="settings">
        <svg viewBox="0 0 24 24" width="26" height="22"><path d="M2 5h20M2 12h20M2 19h20" stroke="#131330" stroke-width="2"/></svg>
      </button>
    </nav>
  </header>

  <!-- 2. SETTINGS PANEL (opens from the hamburger button) -->
  <aside id="settings" class="panel" hidden>
    <h3>Settings</h3>
    <label class="row">Change the top picture automatically
      <input type="checkbox" id="setRotate" class="toggle">
      <span class="switch"></span>
    </label>
    <div class="row">Default video quality
      <select id="setQuality">
        <option>360p</option><option>480p</option><option>720p</option><option>1080p</option>
      </select>
    </div>
    <div class="row">Text size
      <select id="setSize">
        <option value="90">Small</option><option value="100">Normal</option><option value="115">Large</option>
      </select>
    </div>
    <button id="resetBtn" class="ghost">Reset settings</button>
  </aside>

  <!-- 3. HERO: rotating picture, welcome text, JS logo -->
  <section class="hero" aria-label="Welcome">
    <button id="heroBtn" class="heroPic" aria-label="Open this title"></button>
    <p>Welcome, Explore movies, Discover New favorites, and find information about Popular Films, Genres and Latest Releases</p>
    <div class="logo" aria-label="JS logo">
      <span>JS</span>
      <img src="images/logo.png" alt="" onerror="this.remove()">
    </div>
  </section>

  <!-- 4. FILTERS: genre tabs and search -->
  <div class="bar filters">
    <nav class="tabs" id="genreTabs" aria-label="Filter by genre">
      <button data-genre="Thriller">Thriller</button>
      <button data-genre="Action">Action</button>
      <button data-genre="Sci-Fi">Sci-Fi</button>
    </nav>

    <form id="searchForm" role="search">
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="10" cy="10" r="6.5" fill="none" stroke="#000" stroke-width="2.5"/><path d="M15 15l7 7" stroke="#000" stroke-width="3"/></svg>
      </button>
      <input id="searchInput" type="search" placeholder="Search" autocomplete="off" aria-label="Search titles">
    </form>
  </div>

  <!-- 5. POSTER GRID -->
  <h2 id="gridTitle" class="small">Featured</h2>
  <section id="grid" class="grid" aria-live="polite"></section>

  <!-- 6. SELECTED TITLE: player with controls on the picture, then details -->
  <section id="detail" class="detail" aria-label="Selected title">
    <div class="watch">
      <div class="player">
        <div class="stage" id="stage"></div>
        <div class="overlay">
          <button id="rotateBtn" aria-label="Rotate view">⟳ Rotate</button>
          <select id="quality" aria-label="Video quality">
            <option>360p</option><option>480p</option><option>720p</option><option>1080p</option>
          </select>
        </div>
      </div>
      <p id="note" class="small"></p>
    </div>
    <div class="info" id="info"></div>
  </section>

  <!-- 7. FOOTER: social icons and info buttons -->
  <footer id="footer">
    <div class="social">
      <a href="https://www.facebook.com" target="_blank" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#1877f2"/><text x="28" y="42" font-size="46" font-weight="700" fill="#131330" text-anchor="middle" font-family="Arial">f</text></svg>
      </a>
      <a href="https://www.youtube.com" target="_blank" rel="noopener" aria-label="YouTube">
        <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#f00"/><path d="M18 14l17 10-17 10z" fill="#fff"/></svg>
      </a>
      <a href="https://mail.google.com" target="_blank" rel="noopener" aria-label="Gmail">
        <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#fff"/><path d="M12 33V17l12 9 12-9v16" fill="none" stroke="#ea4335" stroke-width="4"/><path d="M12 33V17M36 33V17" stroke="#4285f4" stroke-width="4"/></svg>
      </a>
      <a href="https://www.instagram.com" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 48 48"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fd5"/><stop offset=".5" stop-color="#ff543e"/><stop offset="1" stop-color="#c837ab"/></linearGradient></defs><circle cx="24" cy="24" r="24" fill="url(#ig)"/><rect x="13" y="13" width="22" height="22" rx="7" fill="none" stroke="#fff" stroke-width="3"/><circle cx="24" cy="24" r="5.5" fill="none" stroke="#fff" stroke-width="3"/><circle cx="31" cy="17" r="1.7" fill="#fff"/></svg>
      </a>
    </div>

    <div class="legal">
      <button data-msg="help">Help</button>
      <button data-msg="faq">FAQ</button>
      <button data-msg="feedback">Feedback</button>
      <button data-msg="privacy">Privacy Policy</button>
      <button data-msg="terms">Terms of Service</button>
    </div>
  </footer>

  <!-- 8. EXTRAS: small logo that stays visible, message box -->
  <div id="logoMini" class="logo mini" aria-hidden="true">
    <span>JS</span>
    <img src="images/logo.png" alt="" onerror="this.remove()">
  </div>

  <dialog id="msgBox">
    <h3 id="msgTitle"></h3>
    <p id="msgBody"></p>
    <button id="msgClose" class="ghost">Close</button>
  </dialog>

  <!-- movies.js holds the movie list, script.js holds the behavior -->
  <script src="movies.js"></script>
  <script src="script.js"></script>
</body>
</html>
